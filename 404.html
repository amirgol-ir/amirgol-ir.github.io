<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صفحه پیدا نشد | امیرعلی گل‌چینی</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Vazirmatn", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 10%, #3d0514 0%, #160207 100%);
      color: #f8fafc;
      text-align: center;
    }
    .box {
      max-width: 420px;
      background: #ffffff;
      color: #0f172a;
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }
    .code { font-size: 4rem; font-weight: 900; color: #c51d34; line-height: 1; }
    h1 { font-size: 1.3rem; font-weight: 800; margin: 14px 0 8px; }
    p { color: #475569; line-height: 1.9; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 50px;
      background: linear-gradient(135deg, #560816 0%, #c51d34 52%, #7d1025 100%);
      border: 1.5px solid rgba(223, 183, 82, 0.8);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">۴۰۴</div>
    <h1>صفحه‌ای که دنبالش بودید پیدا نشد</h1>
    <p>ممکن است آدرس اشتباه وارد شده باشد یا این صفحه جابه‌جا شده باشد.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
  </main>
</body>
</html>
